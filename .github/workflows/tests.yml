# Runs the full offline test suite on every push and pull request (Phase 6.9 / P1).
# No secrets are needed: every test uses scripted models, fake APIs and temporary databases.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push cancels the older run of the same branch
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the offline test suite
        env:
          PYTHONIOENCODING: utf-8
        run: pytest -q -p no:cacheprovider
